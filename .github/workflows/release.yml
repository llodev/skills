name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      # Trusted Publishing needs npm CLI >= 11.5.1 for the OIDC token exchange. Pin to the 11.x
      # line: npm 12 added strict config validation and rejects the `git-checks` config that
      # `pnpm publish` (which `changeset publish` shells out to) passes down (EUNKNOWNCONFIG),
      # whereas 11.x still tolerates it. Range stays >=11.5.1 <12 for both OIDC support and compat.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm run typecheck
      - run: node scripts/checks/canary-e2e.mjs
      - run: pnpm run validate
      - run: pnpm run contract:check
      - run: bash scripts/shell/pre-release-check.sh
      - uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth is npm Trusted Publishing (OIDC) — no long-lived token. The `id-token: write`
          # permission above lets the npm CLI mint a short-lived publish token per run, matched
          # against each package's trusted-publisher config on npmjs.com (repo + this workflow
          # file). Confirmed live: pm-tasks-core@1.12.0 published with
          # _npmUser.trustedPublisher = { id: "github" }. Provenance is emitted from the same
          # OIDC identity.
          NPM_CONFIG_PROVENANCE: "true"
