name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      # Trusted Publishing needs npm CLI >= 11.5.1 for the OIDC token exchange. Pin to the 11.x
      # line: npm 12 added strict config validation and rejects the `git-checks` config that
      # `pnpm publish` (which `changeset publish` shells out to) passes down (EUNKNOWNCONFIG),
      # whereas 11.x still tolerates it. Range stays >=11.5.1 <12 for both OIDC support and compat.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm run typecheck
      - run: node scripts/checks/canary-e2e.mjs
      - run: pnpm run validate
      - run: pnpm run contract:check
      - run: bash scripts/shell/pre-release-check.sh
      - uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth precedence: the npm CLI uses Trusted Publishing (OIDC) whenever a trusted
          # publisher is configured for the package on npmjs.com, and only falls back to this
          # token otherwise. The token is kept as a TRANSITIONAL fallback so releases keep
          # working until all packages have a verified trusted publisher; remove NPM_TOKEN /
          # NODE_AUTH_TOKEN once the first OIDC publish is confirmed green.
          # npm's 2FA-bypass tokens lose direct-publish ability ~Jan 2027 — OIDC is the target.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
