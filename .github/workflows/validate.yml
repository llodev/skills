name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so pre-release-check.sh can diff HEAD against origin/main
      # (the skill-judge ratchet gate). A shallow checkout makes that gate self-skip.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      # Node 24 (matching release.yml) — size-limit >=13 dropped Node 20 support
      # (engines: ^22.18.0 || ^24.0.0 || >=26.0.0). Runtime Node-20 coverage stays
      # in e2e.yml / contract-check.yml; published packages remain engines.node >=20.
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm run typecheck
      # Mirror release.yml's gates (minus the actual publish) so a PR fails HERE,
      # not at merge-to-main. Order matches release.yml.
      - run: node scripts/checks/canary-e2e.mjs
      - run: pnpm run validate
      - run: pnpm run contract:check
      - run: bash scripts/shell/pre-release-check.sh
