name: canary-cleanup

on:
  pull_request:
    types: [closed]

# Cleanup reads only the event payload and the checked-out script — no repo
# write access required.
permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Mirror canary-publish's fork guard: a fork PR never had canaries published
      # (publish skips on forks) and has no NPM_TOKEN access anyway.
      - name: Skip if fork
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            {
              echo "### Canary cleanup skipped"
              echo
              echo "PR is from a fork (\`$HEAD_REPO\`); canaries were never published."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::canary-cleanup skipped: PR is from a fork ($HEAD_REPO)"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.should_run == 'true'

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # Best-effort at two levels:
      #   1. Step level — continue-on-error: true so a cleanup failure never
      #      red-fails the PR-close event.
      #   2. Shell level — each npm call is wrapped so a failure on one
      #      package/version does NOT abort the loop; it completes for ALL
      #      packages even on partial failure.
      #
      # npm unpublish only works for a leaf package within npm's 72 h window; it is
      # REFUSED (E405 "has dependent packages") for any version with dependents —
      # e.g. core, which every adapter depends on. So each version tries unpublish
      # first and falls back to `npm deprecate` (npm's recommended retirement path:
      # the version persists, marked do-not-use — npm does NOT garbage-collect it).
      # The PR-scoped dist-tag is stripped regardless so it leaves the tag list.
      # Stale canaries are harmless (never the `latest` tag, never match a `^` range).
      # No [skip canary] check: if publish was skipped there are simply no
      # matching versions and the loop is a no-op.
      - name: Clean up canary versions (untag + unpublish/deprecate)
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Intentionally omit -e: each npm call must be best-effort so the
          # loop completes for all packages even when individual unpublishes fail.
          set -uo pipefail

          PREFIX="0.0.0-pr-${PR_NUMBER}-"

          # Data-driven package set — single source of truth (Task 1).
          PKGS="$(node scripts/checks/canary-version.mjs --list)" || {
            echo "::warning::canary-cleanup: failed to enumerate packages; nothing unpublished"
            {
              echo "### Canary cleanup — PR #${PR_NUMBER}"
              echo
              echo "> **Warning:** failed to enumerate packages — see step log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          REMOVED=0
          DEPRECATED=0
          WARNED=0
          DEPMSG="orphaned canary for closed PR #${PR_NUMBER} — do not use"

          while IFS= read -r name; do
            [ -n "$name" ] || continue

            # Enumerate all published versions; treat registry errors as no-op.
            versions="$(npm view "$name" versions --json 2>/dev/null)" || {
              echo "::warning::canary-cleanup: npm view $name failed; skipping"
              WARNED=$((WARNED + 1))
              continue
            }

            # Filter to this PR's canaries via a unit-tested script module
            # (scripts/checks/canary-cleanup-filter.test.mjs). The trailing dash
            # anchors the number so PR 42 never matches PR 421. PR_NUMBER is a normal
            # script arg (argv[2] of a script file — unlike `node -e`, where the
            # first arg lands at argv[1], which silently broke the filter before).
            matched="$(echo "$versions" | node scripts/checks/canary-cleanup-filter.mjs "$PR_NUMBER")" || {
              echo "::warning::canary-cleanup: failed to filter versions for $name; skipping"
              WARNED=$((WARNED + 1))
              continue
            }

            # Per version: try unpublish first (full removal — works only for leaf
            # packages within npm's 72h window), else deprecate. npm refuses to
            # unpublish a version that has dependents (E405) — e.g. core, which every
            # adapter depends on — so deprecate is the reliable retirement path npm
            # itself recommends. Either way the version stops being advertised.
            while IFS= read -r ver; do
              [ -n "$ver" ] || continue
              if npm unpublish "${name}@${ver}" >/dev/null 2>&1; then
                echo "unpublished ${name}@${ver}"
                REMOVED=$((REMOVED + 1))
              elif npm deprecate -f "${name}@${ver}" "$DEPMSG" >/dev/null 2>&1; then
                echo "deprecated ${name}@${ver}"
                DEPRECATED=$((DEPRECATED + 1))
              else
                echo "::warning::canary-cleanup: could not unpublish or deprecate ${name}@${ver}"
                WARNED=$((WARNED + 1))
              fi
            done <<< "$matched"

            # Strip the PR-scoped dist-tag so it no longer clutters `npm dist-tags`
            # (a tag can dangle after unpublish; removal always works and is harmless
            # if the tag is already gone).
            npm dist-tag rm "$name" "pr-${PR_NUMBER}" >/dev/null 2>&1 \
              && echo "removed dist-tag pr-${PR_NUMBER} from ${name}" || true
          done <<< "$PKGS"

          {
            echo "### Canary cleanup — PR #${PR_NUMBER}"
            echo
            echo "Prefix \`${PREFIX}\`: removed **${REMOVED}**, deprecated **${DEPRECATED}**; dist-tag \`pr-${PR_NUMBER}\` stripped from each package."
            if [ "$WARNED" -gt 0 ]; then
              echo
              echo "> **${WARNED}** warning(s) — see step log for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
