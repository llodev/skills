version: 2
updates:
  # Root npm + pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    target-branch: "main"
    reviewers:
      - "lloliveiradev"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ajv"
        update-types: ["version-update:semver-major"]

  # Per-package npm (TS adapters with their own package.json + deps)
  - package-ecosystem: "npm"
    directory: "/pm-tasks/pm-tasks-core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    target-branch: "main"
    reviewers:
      - "lloliveiradev"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

